name: Bug report
description: Something in the site or admin panel isn't working as expected
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where does this happen?
      options:
        - Public site (home page, blog list, blog post)
        - Admin panel (dashboard, add/list blog, comments)
        - Login / authentication
        - Image upload
        - AI content generation (Gemini)
        - API / backend (no UI involved)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Browser/OS (if this is a UI bug):
        - Local dev or the deployed site (thestockhub.vercel.app)?
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors, or API responses
      description: Paste any relevant browser console output, network response, or server logs.
    validations:
      required: false
