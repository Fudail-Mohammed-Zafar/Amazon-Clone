name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where would this apply?
      options:
        - Public site (home page, blog list, blog post)
        - Admin panel (dashboard, add/list blog, comments)
        - API / backend
        - Design / UX
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing or awkward today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
